name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Il runner non ha un .env: senza queste, app.config.Settings fallisce la
    # validazione all'import (SECRET_KEY/JWT_SECRET) e la suite muore prima di
    # partire. Sono chiavi USA-E-GETTA, generate per la CI e valide solo qui:
    # non cifrano e non firmano nulla che esista fuori da questo job. Il DB e'
    # comunque riscritto a SQLite dal conftest prima di ogni import di app.*.
    env:
      SECRET_KEY: "8lGskiwa4OemnoItMwY9qRsBeNr4qzOKhl3NSLs46Wg="
      JWT_SECRET: "iO4VwUcDUZjBunQ5ZNXfg-EuEr_qmpREbmYQDglDaoo"
      PHONE_HMAC_KEY: "IFntdaCtw2-lQ5x-HIbOSSmrl-vyHlDh1YPEJoECXe0"
      DATABASE_URL: "sqlite+aiosqlite:///./data/test_bot.db"
    # I test con guardia _redis_o_skip (mutua esclusione vera del lucchetto
    # profilo WA) skippano senza un Redis raggiungibile: senza questo servizio
    # la CI resterebbe verde senza averli mai eseguiti.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app alembic/versions
      - run: pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
